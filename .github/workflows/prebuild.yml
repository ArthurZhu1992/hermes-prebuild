name: Hermes prebuild

# 只做一件事：把上游 NousResearch/hermes-agent 在某个 ref 上编译一遍，
# 产出"已编译目录树"的 zip artifact，供各机器覆盖后让 hermes update 跳过本地编译。
#
# 产物（artifact 名 = hermes-<os>-<arch>-<sha12>）：
#   hermes-win-x64-<sha12>      win-unpacked + apps/desktop/dist + build/install-stamp.json + web_dist + ui-tui/dist
#   hermes-linux-x64-<sha12>    同上，linux-unpacked
#   hermes-cli-linux-<sha12>    只含 web_dist + ui-tui/dist（纯 CLI 机器用，~2.4 MB）
#   hermes-cli-win-x64-<sha12>  同上，manifest.platform=win32（Windows 纯 CLI 机器）
#   每个 artifact 内都有 manifest.json（ref/sha/platform/arch/node/built_at）
#
# 只构建上游正式版（release tag），不出 main / 分支的滚动产物：
#   stable（ref = 上游最新 release tag，或 dispatch 指定的历史 tag）→ v0.23.1
#   release tag 与版本号同名，一条 release 永久保留，既是下载点也是回退锚点
#   dispatch 给了非 tag ref（main / 分支 / 裸 sha）→ resolve 直接跳过，什么都不编
#
# 触发：
#   schedule  每天 03:17 UTC 检查上游最新 release tag，本仓库还没有它的产物才构建
#   dispatch  手动指定上游 tag（如 v0.22.7）补历史版本的产物

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "upstream release tag, 例 v0.23.1（留空 = 自动取上游最新 release tag）"
        required: false
        default: ""
      force:
        description: "ignore the last-built state and build anyway"
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    # 只在本仓库的构建器自身变化时跑，state/ 的自动提交不会回头触发（防循环）
    paths:
      - '.github/workflows/prebuild.yml'
      - 'scripts/**'

permissions:
  contents: write        # state/last-built.json 的提交
  actions: write         # 删旧 artifact 需要 write（只读会 403，被 set +e 吞掉）

concurrency:
  # 按目标 ref 分组：stable 与 main 可以并行，同一 ref 的重复触发排队而不互相打断
  group: prebuild-${{ inputs.ref || 'latest-tag' }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      short: ${{ steps.r.outputs.short }}
      changed: ${{ steps.r.outputs.changed }}
      ref: ${{ steps.r.outputs.ref }}
      version: ${{ steps.r.outputs.version }}
      tag: ${{ steps.r.outputs.tag }}
      stable: ${{ steps.r.outputs.stable }}
      ahead: ${{ steps.r.outputs.ahead }}
      persist: ${{ steps.r.outputs.persist }}
      reltag: ${{ steps.r.outputs.reltag }}
      nextref: ${{ steps.r.outputs.nextref }}
      reason: ${{ steps.r.outputs.reason }}
    steps:
      - uses: actions/checkout@v4          # 本仓库，为了读 state/
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref || '' }}
          FORCE: ${{ inputs.force || 'false' }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          UP=NousResearch/hermes-agent
          tag=$(gh api "repos/$UP/releases/latest" --jq .tag_name)
          tag_sha=$(gh api "repos/$UP/commits/$tag" --jq .sha)
          last_tag=$(jq -r --arg t "$tag" '.[$t].sha // "none"' state/last-built.json 2>/dev/null || echo none)

          # 本仓库有没有上游最新正式版的 release —— 用列表 + index 判断，不依赖单条
          # /releases/tags/<tag> 的 404 行为（gh 各版本 stdout 不一致）。
          reason=""
          have_stable=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                        --jq "[.[].tag_name] | index(\"$tag\")" 2>/dev/null || echo null)
          case "$have_stable" in ''|null) have_stable="";; esac
          echo "本仓库 $tag release：${have_stable:-不存在}"

          skip=false
          if [ -n "${INPUT_REF:-}" ]; then
            ref="$INPUT_REF"; sha=$(gh api "repos/$UP/commits/$ref" --jq .sha)
            reason="手动指定 ref=$ref"
          elif [ -z "$have_stable" ]; then
            ref="$tag"; sha="$tag_sha"
            reason="stable 缺口：$tag 还没有产物 → 编它"
          elif [ "$tag_sha" != "$last_tag" ] || [ "$FORCE" = "true" ]; then
            ref="$tag"; sha="$tag_sha"
            reason="stable 新版 / 强制重建：$tag（$last_tag -> $tag_sha）"
          else
            # 已有产物且 state 记的就是这个 sha —— 必须在这里就定死「不编」，
            # 否则下面「是 tag 就 changed=true」会把早退覆盖掉，schedule 每天白编一遍同版本
            ref="$tag"; sha="$tag_sha"; skip=true
            reason="上游最新正式版 $tag 已有产物（state 同 sha），早退（只构建稳定版）"
          fi

          # 只认上游正式版 tag：main / 分支 / 裸 sha 一律不编；已有产物同样早退
          if [ "$skip" = true ]; then
            changed=false
          elif [ "$sha" = "$tag_sha" ] || [[ "$ref" == v[0-9]* ]]; then
            changed=true
          else
            changed=false
            reason="只构建上游正式版 tag：$ref 不是 release tag → 跳过"
          fi
          echo "$reason"

          short=${sha:0:12}

          # ── 版本号：只出上游语义版本 ────────────────────────────────────────
          #   上游最新 release tag 的 sha  →  v0.23.1
          #   dispatch 指定的历史 tag      →  v0.22.7
          # release tag 与版本号同名；persist 恒为 true → 一条 release 永久保留，既是下载点也是回退锚点。
          ahead=""; persist=true; reltag=""; version=""; stable=true
          if [ "$changed" = true ]; then
            if [ "$sha" = "$tag_sha" ]; then reltag="$tag"; version="$tag"
            else reltag="$ref"; version="$ref"; fi
          fi

          {
            echo "sha=$sha"; echo "short=$short"; echo "ref=$ref"
            echo "changed=$changed"; echo "version=$version"
            echo "tag=$tag"; echo "stable=$stable"; echo "ahead=${ahead:-}"
            echo "persist=$persist"; echo "reltag=$reltag"
            echo "nextref=${nextref:-}"; echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          echo "ref=$ref sha=$sha version=$version persist=$persist reltag=$reltag changed=$changed"

  # ── Windows 桌面壳 ────────────────────────────────────────────────────────
  build-win:
    needs: resolve
    if: needs.resolve.outputs.changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      REF: ${{ needs.resolve.outputs.ref }}
      SHA: ${{ needs.resolve.outputs.sha }}
      SHORT: ${{ needs.resolve.outputs.short }}
      VERSION: ${{ needs.resolve.outputs.version }}
      PYTHONUTF8: '1'
    steps:
      - name: 取上游源码
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ needs.resolve.outputs.sha }}
          path: src
          fetch-depth: 1

      - name: 让 stamp 认得出渠道（分支名）
        shell: bash
        working-directory: .
        run: |
          if [[ "$REF" =~ ^v?[0-9]+\.[0-9]+ ]] || [[ "$REF" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "detached at $REF（tag / commit）→ stamp.branch = null，与目标机 detached 状态一致"
          else
            git -C src checkout -q -B "$REF"
            echo "attached: $(git -C src rev-parse --abbrev-ref HEAD) → stamp.branch = $REF"
          fi

      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }

      - name: uv
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          echo "$env:USERPROFILE\.local\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Python 依赖
        working-directory: src
        run: |
          uv venv .venv --python 3.14
          uv pip install -e .

      - name: PM 工具链（node 26.12.1 / pnpm 12.15.0，按 pm/lock.json 校验 sha256）
        working-directory: src
        run: .venv\Scripts\python.exe -m pm.cli install --tools-only

      - name: 构建（与 hermes update 同一套函数）
        working-directory: src
        # GITHUB_SHA 是 GitHub 的默认环境变量，workflow 的 env: 覆盖不了（官方限制），
        # 只能在进程内 unset。否则 write-build-stamp.mjs 的 fromCI() 会把「builder 仓库的提交」
        # 烘进 stamp（source=ci / commit 错），目标机上 stampDrift 永远不匹配 → 复用失效。
        run: |
          $env:GITHUB_SHA = $null
          $env:GITHUB_REF_NAME = $null
          $env:GITHUB_HEAD_REF = $null
          .venv\Scripts\python.exe -c "from pathlib import Path; from hermes_cli.source_build import build_update_products; build_update_products(Path('.').resolve(), desktop=True)"

      - name: 写 manifest
        working-directory: src
        shell: pwsh
        run: |
          $node = (Get-Content pm/lock.json -Raw | ConvertFrom-Json).packages.node.version
          $m = [ordered]@{
            ref = $env:REF; sha = $env:SHA; version = $env:VERSION; platform = 'win32'; arch = 'x64'
            node = $node; built_at = (Get-Date).ToUniversalTime().ToString('o')
            workflow_run = $env:GITHUB_RUN_ID
          }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $m | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 out/manifest.json
          Get-ChildItem out | Select-Object Name,Length | Format-Table

      - name: 收集产物
        shell: pwsh
        run: |
          $dst = 'payload'
          New-Item -ItemType Directory -Force -Path $dst/apps/desktop/release,$dst/apps/desktop/build,$dst/apps/desktop/dist,$dst/hermes_cli/web_dist,$dst/ui-tui/dist | Out-Null
          Copy-Item src/apps/desktop/release/win-unpacked -Destination $dst/apps/desktop/release -Recurse
          Copy-Item src/apps/desktop/build/install-stamp.json -Destination $dst/apps/desktop/build
          Copy-Item src/apps/desktop/dist/* -Destination $dst/apps/desktop/dist -Recurse
          Copy-Item src/hermes_cli/web_dist/* -Destination $dst/hermes_cli/web_dist -Recurse
          Copy-Item src/ui-tui/dist/* -Destination $dst/ui-tui/dist -Recurse
          Copy-Item src/out/manifest.json -Destination $dst
          "win payload: " + [math]::Round((Get-ChildItem $dst -Recurse | Measure-Object Length -Sum).Sum/1MB) + " MB"

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-win-x64-${{ needs.resolve.outputs.short }}
          path: payload
          retention-days: 7
          compression-level: 6

  # ── Linux 桌面壳 + CLI 轻包 ───────────────────────────────────────────────
  build-linux:
    needs: resolve
    if: needs.resolve.outputs.changed == 'true'
    runs-on: ubuntu-24.04          # 目标机 24.04 / 26.04 都能跑；不要用更新的镜像当构建机
    timeout-minutes: 90
    env:
      REF: ${{ needs.resolve.outputs.ref }}
      SHA: ${{ needs.resolve.outputs.sha }}
      SHORT: ${{ needs.resolve.outputs.short }}
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: 取上游源码
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ needs.resolve.outputs.sha }}
          path: src
          fetch-depth: 1

      - name: 让 stamp 认得出渠道（分支名）
        shell: bash
        working-directory: .
        run: |
          if [[ "$REF" =~ ^v?[0-9]+\.[0-9]+ ]] || [[ "$REF" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "detached at $REF（tag / commit）→ stamp.branch = null，与目标机 detached 状态一致"
          else
            git -C src checkout -q -B "$REF"
            echo "attached: $(git -C src rev-parse --abbrev-ref HEAD) → stamp.branch = $REF"
          fi

      - name: 系统库（electron-builder 打包需要）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libgtk-3-0t64 libasound2t64 libgbm1 xvfb || \
          sudo apt-get install -y -qq libnss3 libgtk-3-0 libasound2 libgbm1 xvfb

      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }

      - name: uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Python 依赖
        working-directory: src
        run: |
          uv venv .venv --python 3.14
          uv pip install -e .

      - name: PM 工具链
        working-directory: src
        run: .venv/bin/python -m pm.cli install --tools-only

      - name: 构建
        working-directory: src
        # 同 build-win：GITHUB_SHA 无法用 env: 覆盖，必须在进程内 unset，让 stamp 走 fromLocalGit()
        run: |
          env -u GITHUB_SHA -u GITHUB_REF_NAME -u GITHUB_HEAD_REF             .venv/bin/python -c "from pathlib import Path; from hermes_cli.source_build import build_update_products; build_update_products(Path('.').resolve(), desktop=True)"

      - name: 写 manifest + 收集产物
        working-directory: src
        run: |
          set -euo pipefail
          node=$(python -c "import json;print(json.load(open('pm/lock.json'))['packages']['node']['version'])")
          mkdir -p out
          python - "$node" <<'PY'
          import json,os,sys,datetime
          json.dump({"ref":os.environ["REF"],"sha":os.environ["SHA"],"version":os.environ.get("VERSION",""),"platform":"linux","arch":"x64",
                     "node":sys.argv[1],"built_at":datetime.datetime.now(datetime.UTC).isoformat(),
                     "workflow_run":os.environ["GITHUB_RUN_ID"]}, open("out/manifest.json","w"), indent=2)
          PY
          mkdir -p ../payload-full/apps/desktop/release ../payload-full/apps/desktop/build ../payload-full/apps/desktop/dist ../payload-full/hermes_cli/web_dist ../payload-full/ui-tui/dist
          cp -a apps/desktop/release/linux-unpacked ../payload-full/apps/desktop/release/
          cp -a apps/desktop/build/install-stamp.json ../payload-full/apps/desktop/build/
          cp -a apps/desktop/dist/. ../payload-full/apps/desktop/dist/
          cp -a hermes_cli/web_dist/. ../payload-full/hermes_cli/web_dist/
          cp -a ui-tui/dist/. ../payload-full/ui-tui/dist/
          cp out/manifest.json ../payload-full/
          # 轻包：只给纯 CLI 机器（无 Electron）
          mkdir -p ../payload-cli/hermes_cli/web_dist ../payload-cli/ui-tui/dist
          cp -a hermes_cli/web_dist/. ../payload-cli/hermes_cli/web_dist/
          cp -a ui-tui/dist/. ../payload-cli/ui-tui/dist/
          cp out/manifest.json ../payload-cli/
          # Windows 纯 CLI：同一份前端产物（平台无关），只把 manifest.platform 改成 win32 让资产名与校验对位
          cp -a ../payload-cli ../payload-cli-win
          python3 - ../payload-cli-win/manifest.json <<'PY'
          import json, sys
          p = sys.argv[1]
          d = json.load(open(p)); d["platform"] = "win32"
          json.dump(d, open(p, "w"), indent=2)
          PY
          du -sh ../payload-full ../payload-cli ../payload-cli-win

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-linux-x64-${{ needs.resolve.outputs.short }}
          path: payload-full
          retention-days: 7
          compression-level: 6

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-cli-linux-${{ needs.resolve.outputs.short }}
          path: payload-cli
          retention-days: 7
          compression-level: 9

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-cli-win-x64-${{ needs.resolve.outputs.short }}
          path: payload-cli-win
          retention-days: 7
          compression-level: 9

  # ── 记录状态（同时解决 public 仓库 60 天无活动被禁用定时任务的问题）────────
  state:
    needs: [resolve, build-win, build-linux]
    if: always() && needs.resolve.outputs.changed == 'true' && needs.build-win.result == 'success' && needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          REF: ${{ needs.resolve.outputs.ref }}
          SHA: ${{ needs.resolve.outputs.sha }}
          SHORT: ${{ needs.resolve.outputs.short }}
        run: |
          mkdir -p state
          python - <<'PY'
          import json,os,datetime,pathlib
          p = pathlib.Path('state/last-built.json')
          d = json.loads(p.read_text()) if p.exists() else {}
          d[os.environ['REF']] = {"sha": os.environ['SHA'], "short": os.environ['SHORT'],
                                  "built_at": datetime.datetime.now(datetime.UTC).isoformat()}
          p.write_text(json.dumps(d, indent=2, ensure_ascii=False) + "\n")
          PY
          git config user.name  "hermes-prebuild"
          git config user.email "hermes-prebuild@users.noreply.github.com"
          git add state/last-built.json
          git commit -m "state: $REF @ $SHORT" || echo "nothing to commit"
          git pull --rebase --autostash -q || true
          git push || (git pull --rebase --autostash -q && git push)

      - name: 清理旧 artifact（只留当前这个 SHA 的三份）
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ needs.resolve.outputs.short }}     # 必须显式传：step 之间不共享 env
        run: |
          set +e
          kept=0; deleted=0
          while read -r id name; do
            [ -z "$id" ] && continue
            case "$name" in
              *"$SHORT"*) kept=$((kept+1)); continue ;;
            esac
            if gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" >/dev/null 2>&1; then
              deleted=$((deleted+1)); echo "deleted $name"
            else
              echo "!! 删不掉 $name ($id)"
            fi
          done < <(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100"                      --jq '.artifacts[] | "\(.id) \(.name)"')
          echo "保留 $kept 份（当前 SHA $SHORT），删除 $deleted 份"

  # ── 发布 ───────────────────────────────────────────────────────────────────
  # 两条线分开，Releases 列表才干净：
  #   persist（sha == 上游最新 release tag，或 --ref 指到某个上游 tag）
  #              → 一条独立 release，tag 就是版本号（v0.23.1），永久保留，回退锚点
  #   main 线   （tag 之后的提交 / 任意分支）
  #              → 一条 tag=main 的滚动 release，标题带版本号，只留最近 2 个 SHA
  # 资产名始终带 sha12，脚本按 sha12 精确取件；版本号只负责「人看」与「回退锚点」。
  publish:
    needs: [resolve, build-win, build-linux]
    if: needs.build-win.result == 'success' && needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
      SHA: ${{ needs.resolve.outputs.sha }}
      SHORT: ${{ needs.resolve.outputs.short }}
      REF: ${{ needs.resolve.outputs.ref }}
      VERSION: ${{ needs.resolve.outputs.version }}
      BASE: ${{ needs.resolve.outputs.tag }}
      STABLE: ${{ needs.resolve.outputs.stable }}
      AHEAD: ${{ needs.resolve.outputs.ahead }}
      PERSIST: ${{ needs.resolve.outputs.persist }}
      REASON: ${{ needs.resolve.outputs.reason }}
      RELTAG: ${{ needs.resolve.outputs.reltag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 打包成 release 资产（文件名带 sha12）
        run: |
          set -euo pipefail
          cd dist
          for d in */; do
            n=${d%/}
            python3 -c "import shutil,sys; shutil.make_archive(sys.argv[1],'zip','.',sys.argv[1])" "$n"
          done
          ls -la *.zip

      - name: 决定 release 位置与标题
        run: |
          set -euo pipefail
          # 只有稳定版一条线：release tag == 版本号，标题也只写版本号，永久保留、不清理
          echo "REL_TAG=$RELTAG"  >> "$GITHUB_ENV"
          echo "REL_TITLE=$VERSION" >> "$GITHUB_ENV"
          echo "REL_PRE=false"    >> "$GITHUB_ENV"

      - name: 写 release 说明
        run: |
          set -euo pipefail
          {
            printf '**版本** `%s`  ·  上游 `%s` @ `%s`\n\n' "$VERSION" "$REF" "$SHORT"
            printf '> 决策：%s\n\n' "$REASON"
            printf '> 上游正式版 `%s` 的产物。**永久保留**，可随时 `--ref %s` 回退到此版本。\n\n' "$VERSION" "$VERSION"
            printf '| 资产 | 大小 | 用于 |\n|---|---|---|\n'
            for f in dist/*.zip; do
              b=$(basename "$f")
              case "$b" in
                hermes-linux-x64-*) use='Linux 桌面壳 + CLI' ;;
                hermes-win-x64-*)   use='Windows 桌面壳' ;;
                hermes-cli-linux-*) use='纯 CLI（无 Electron）' ;;
                hermes-cli-win-x64-*) use='纯 CLI（Windows）' ;;
                *)                  use='—' ;;
              esac
              printf '| `%s` | %s MB | %s |\n' "$b" "$(( $(stat -c%s "$f") / 1048576 ))" "$use"
            done
            printf '\n构建时间 %s\n\n' "$(date -u '+%Y-%m-%d %H:%M UTC')"
            printf '**用法**：`./hermes-update.sh --ref %s`（Windows: `-Ref %s`）。release 通道匿名可下，不需要 token。\n\n' "$REF" "$REF"
            printf '**上游 release**：<https://github.com/NousResearch/hermes-agent/releases/tag/%s>（commit `%s`）\n' \
              "$VERSION" "$SHA"
          } > notes.md

          # manifest.json：这一批的权威元数据（脚本优先读它拿版本号，不再依赖滚动 latest.json）
          node_v=$(python3 -c "import json;print(json.load(open('dist/hermes-linux-x64-$SHORT/manifest.json'))['node'])" 2>/dev/null || echo unknown)
          python3 - "$VERSION" "$node_v" <<'PY' > manifest.json
          import json, sys, os, datetime
          json.dump({
              "version": sys.argv[1],
              "ref": os.environ["REF"],
              "sha": os.environ["SHA"],
              "short": os.environ["SHORT"],
              "base": os.environ["BASE"],
              "persist": os.environ["PERSIST"] == "true",
              "platform": "all",
              "node": sys.argv[2],
              "built_at": datetime.datetime.now(datetime.UTC).isoformat(),
              "workflow_run": os.environ.get("GITHUB_RUN_ID", ""),
              "assets": sorted(x for x in os.listdir("dist") if x.endswith(".zip")),
          }, sys.stdout, indent=2)
          PY

      - name: 上传到 release
        run: |
          set -euo pipefail
          pre_flag=()
          [ "$REL_PRE" = "true" ] && pre_flag=(--prerelease)
          if ! gh release view "$REL_TAG" -R "$R" >/dev/null 2>&1; then
            gh release create "$REL_TAG" -R "$R" --title "$REL_TITLE" --notes '首次构建。' "${pre_flag[@]}"
          fi
          gh release upload "$REL_TAG" dist/*.zip manifest.json -R "$R" --clobber
          gh release edit "$REL_TAG" -R "$R" --title "$REL_TITLE" --notes-file notes.md
          echo "--- $REL_TAG 现有资产 ---"
          gh release view "$REL_TAG" -R "$R" --json assets --jq '.assets[]|"\(.name)\t\(.size)"'
